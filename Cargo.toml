[package]
name = "codebase"
version = "0.5.0"
edition = "2021"
rust-version = "1.80"
description = "See and understand any codebase: a living map, plain-language explanations, and ready-to-paste AI prompts."
authors = ["Hasin Md. Daiyan <daiyanhasin07@gmail.com>"]
license = "MIT"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ignore = "0.4"
notify = "6"
sha1_smol = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
